plugins {
    id 'java'
    id 'org.xf.loom'
}

group = 'com.xf.lg'
version = '2.0.0'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

xfLoom {
    minecraftVersion = '26.3'
}

configurations {
    embed
}

dependencies {
    compileOnly files('../libs/asm-9.8.jar')
    embed files('../libs/asm-9.8.jar')
    compileOnly files('../libs/brigadier-1.3.11.jar')

    compileOnly 'net.fabricmc:fabric-loader:0.19.5'
    compileOnly 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 17
}

// ---------- Fabric 版 (不带 ASM) ----------
tasks.register('jarFabric', Jar) {
    archiveFileName = 'xfLoader-fabric.jar'
    from sourceSets.main.output
    from('xf_datapacks') { into 'xf_datapacks' }
    // 不包含 configurations.embed
    manifest {
        attributes('Manifest-Version': '1.0')
    }
}

// ---------- 独立版 (带 ASM) ----------
tasks.register('jarAgent', Jar) {
    archiveFileName = 'xfLoader-agent.jar'
    from sourceSets.main.output
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('xf_datapacks') { into 'xf_datapacks' }
    manifest {
        attributes(
            'Manifest-Version': '1.0',
            'Premain-Class': 'com.xf.lg.MyLoaderAgent',
            'Can-Retransform-Classes': 'true'
        )
    }
}

// 默认 build 编两个
tasks.named('build') {
    dependsOn 'jarFabric', 'jarAgent'
}

// FCL 用的独立版 (自动拷过去)
tasks.register('copyToFcl') {
    dependsOn 'jarAgent'
    doLast {
        copy {
            from tasks.named('jarAgent').get().archiveFile
            into '/storage/emulated/0/FCL/.minecraft/versions/26.3 xf'
            rename { 'xiaofang.jar' }
        }
    }
}

build.dependsOn copyToFcl
