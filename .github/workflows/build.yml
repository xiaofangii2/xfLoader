name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download ASM
        run: |
          mkdir -p libs
          curl -L -o libs/asm-9.8.jar \
            https://repo1.maven.org/maven2/org/ow2/asm/asm/9.8/asm-9.8.jar

      - name: Download Brigadier
        run: |
          mkdir -p /tmp/deps
          curl -L -o /tmp/deps/brigadier.jar \
            https://libraries.minecraft.net/com/mojang/brigadier/1.3.11/brigadier-1.3.11.jar

      - name: Patch build.gradle for CI paths
        run: |
          sed -i "s|/storage/emulated/0/FCL/.minecraft/libraries/com/mojang/brigadier/1.3.11/brigadier-1.3.11.jar|/tmp/deps/brigadier.jar|" build.gradle
          sed -i "/copyToFcl/d" build.gradle
          sed -i "/build.dependsOn copyToFcl/d" build.gradle

      - name: Build with Gradle
        run: ./gradlew clean build --console=plain

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfLoader
          path: build/libs/*.jar

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
