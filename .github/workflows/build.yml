name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare dependencies
        run: |
          mkdir -p libs /tmp/deps
          curl -L -o libs/asm-9.8.jar \
            https://repo1.maven.org/maven2/org/ow2/asm/asm/9.8/asm-9.8.jar
          curl -L -o /tmp/deps/brigadier.jar \
            https://libraries.minecraft.net/com/mojang/brigadier/1.3.11/brigadier-1.3.11.jar

      - name: Patch loader/build.gradle for CI
        run: |
          python3 - << 'PYEOF'
          import re
          p = 'loader/build.gradle'
          s = open(p).read()
          s = s.replace(
              "'/storage/emulated/0/FCL/.minecraft/libraries/com/mojang/brigadier/1.3.11/brigadier-1.3.11.jar'",
              "'/tmp/deps/brigadier.jar'"
          )
          s = re.sub(r"tasks\.register\('copyToFcl'\).*?\n\}", "", s, flags=re.S)
          s = re.sub(r"build\.dependsOn copyToFcl\n?", "", s)
          open(p, 'w').write(s)
          print('--- patched loader/build.gradle ---')
          print(s)
          PYEOF

      - name: Build with Gradle
        run: ./gradlew clean build --console=plain

      - name: Collect jars
        run: |
          mkdir -p build/libs
          cp loader/build/libs/xfLoader.jar build/libs/
          cp installer/build/libs/xfLoader-install.jar build/libs/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfLoader-jars
          path: |
            build/libs/xfLoader.jar
            build/libs/xfLoader-install.jar

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/xfLoader.jar
            build/libs/xfLoader-install.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
