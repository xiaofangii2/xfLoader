name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Prepare dependencies
        run: |
          mkdir -p libs /tmp/deps forge_deps
          curl -L -o libs/asm-9.8.jar https://repo1.maven.org/maven2/org/ow2/asm/asm/9.8/asm-9.8.jar
          curl -L -o libs/brigadier-1.3.11.jar https://libraries.minecraft.net/com/mojang/brigadier/1.3.11/brigadier-1.3.11.jar
          curl -L -o forge_deps/fastutil-8.5.18.jar https://repo1.maven.org/maven2/it/unimi/dsi/fastutil/8.5.18/fastutil-8.5.18.jar
          curl -L -o forge_deps/forge-26.3-66.0.13-universal.jar https://maven.minecraftforge.net/net/minecraftforge/forge/26.3-66.0.13/forge-26.3-66.0.13-universal.jar
          curl -L -o forge_deps/mixin-0.8.7.jar https://repo.spongepowered.org/repository/maven-public/org/spongepowered/mixin/0.8.7/mixin-0.8.7.jar
          curl -L -o forge_deps/eventbus-6.2.33.jar https://maven.minecraftforge.net/net/minecraftforge/eventbus/6.2.33/eventbus-6.2.33.jar
          curl -L -o libs/minecraft.jar https://piston-data.mojang.com/v1/objects/e877b6a07acd633fb3bb475002175cec036e7b87/client.jar

      - name: Patch build.gradle for CI
        run: |
          # 替换 Forge 的本地路径
          sed -i "s|compileOnly files('/storage/emulated/0/FCL/.minecraft/libraries/com/mojang/brigadier/1.3.11/brigadier-1.3.11.jar')|compileOnly files('../libs/brigadier-1.3.11.jar')|" loader/build.gradle
          sed -i "/copyToFcl/,/^}/d" loader/build.gradle
          sed -i "/build.dependsOn copyToFcl/d" loader/build.gradle
          sed -i "s|compileOnly files('/storage/emulated/0/FCL/.minecraft/libraries/it/unimi/dsi/fastutil/8.5.18/fastutil-8.5.18.jar')|compileOnly files('../forge_deps/fastutil-8.5.18.jar')|" forge/build.gradle

      - name: Build all modules
        run: ./gradlew clean build --console=plain

      - name: Collect jars
        run: |
          mkdir -p build/libs
          cp loader/build/libs/xfLoader-agent.jar build/libs/ || true
          cp loader/build/libs/xfLoader-fabric.jar build/libs/ || true
          cp forge/build/libs/xfLoader-forge.jar build/libs/ || true
          cp installer/build/libs/xfLoader-install.jar build/libs/ || true

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
