name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download ASM 9.8
        run: |
          mkdir -p libs
          curl -L -o libs/asm-9.8.jar \
            https://repo1.maven.org/maven2/org/ow2/asm/asm/9.8/asm-9.8.jar

      - name: Compile
        run: |
          mkdir -p out
          BRIG_URL="https://repo1.maven.org/maven2/com/mojang/brigadier/1.3.11/brigadier-1.3.11.jar"
          curl -L -o /tmp/brigadier.jar "$BRIG_URL"
          javac -cp "libs/asm-9.8.jar:/tmp/brigadier.jar" \
                -d out $(find src -name "*.java")

      - name: Package fat jar
        run: |
          mkdir -p fat
          cd fat
          unzip -o ../libs/asm-9.8.jar -d . > /dev/null
          rm -rf META-INF
          cp -r ../out/com ./com
          cp ../META-INF/MANIFEST.MF .
          jar cfm ../xiaofang-fat.jar MANIFEST.MF com org
          cd ..
          ls -la xiaofang-fat.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaofang-fat
          path: xiaofang-fat.jar

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: xiaofang-fat.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
